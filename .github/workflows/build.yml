name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also publish a GitHub Release with this tag, e.g. v1.0.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Key2KeyboardFixer.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/Key2KeyboardFixer-debug.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Key2KeyboardFixer-apk
          path: out/*.apk

      # Runs for pushed v* tags, or for a manual run with a release tag (the tag is then
      # created here, on the commit that was just built).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: KEY2 Keyboard Fixer ${{ inputs.release_tag || github.ref_name }}
          files: out/Key2KeyboardFixer.apk
          generate_release_notes: true
